name: aaemu

services:
  database:
    image: wingsjuanka/aaemu-database:${AAEMU_IMAGE_TAG:-0.3.0.0-alpha}
    build:
      context: .
      dockerfile: deploy/docker/database/Dockerfile
    container_name: aaemu-database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${AAEMU_DB_PASSWORD:?Define AAEMU_DB_PASSWORD in .env.docker}
      TZ: ${AAEMU_TIMEZONE:-America/Santiago}
    volumes:
      - aaemu-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - aaemu-network

  login:
    image: wingsjuanka/aaemu-login:${AAEMU_IMAGE_TAG:-0.3.0.0-alpha}
    build:
      context: .
      dockerfile: AAEmu.Login/Dockerfile
      args:
        CONFIGURATION: ${AAEMU_BUILD_CONFIGURATION:-Release}
    container_name: aaemu-login
    restart: unless-stopped
    environment:
      SecretKey: ${AAEMU_SECRET_KEY:?Define AAEMU_SECRET_KEY in .env.docker}
      AutoAccount: ${AAEMU_AUTO_ACCOUNT:-true}
      SkipHostResolve: "false"
      InternalNetwork__Host: "*"
      InternalNetwork__Port: "1234"
      Connections__AutoApplyUpdates: "true"
      Connections__MySQLProvider__Host: database
      Connections__MySQLProvider__Port: "3306"
      Connections__MySQLProvider__User: root
      Connections__MySQLProvider__Password: ${AAEMU_DB_PASSWORD}
      Connections__MySQLProvider__Database: aaemu_login
      GameServers__0__Id: "1"
      GameServers__0__Name: ${AAEMU_SERVER_NAME:-AAEmu.Game}
      GameServers__0__Host: ${AAEMU_PUBLIC_GAME_HOST:?Define AAEMU_PUBLIC_GAME_HOST in .env.docker}
      GameServers__0__Port: ${AAEMU_PUBLIC_GAME_PORT:-1239}
      GameServers__0__Hidden: "false"
      TZ: ${AAEMU_TIMEZONE:-America/Santiago}
    ports:
      - "${AAEMU_LOGIN_HOST_PORT:-1237}:1237/tcp"
    volumes:
      - aaemu-login-logs:/app/Logs
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1234 && nc -z 127.0.0.1 1237"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      database:
        condition: service_healthy
    networks:
      - aaemu-network

  game:
    image: wingsjuanka/aaemu-game:${AAEMU_IMAGE_TAG:-0.3.0.0-alpha}
    build:
      context: .
      dockerfile: AAEmu.Game/Dockerfile
      args:
        CONFIGURATION: ${AAEMU_BUILD_CONFIGURATION:-Release}
    container_name: aaemu-game
    restart: unless-stopped
    environment:
      SecretKey: ${AAEMU_SECRET_KEY}
      LoginNetwork__Host: login
      LoginNetwork__Port: "1234"
      Network__Host: "*"
      Network__Port: "1239"
      StreamNetwork__Host: "*"
      StreamNetwork__Port: ${AAEMU_STREAM_PORT:-1250}
      Connections__AutoApplyUpdates: "true"
      Connections__MySQLProvider__Host: database
      Connections__MySQLProvider__Port: "3306"
      Connections__MySQLProvider__User: root
      Connections__MySQLProvider__Password: ${AAEMU_DB_PASSWORD}
      Connections__MySQLProvider__Database: aaemu_game
      ClientData__Sources__0: /app/ClientData
      ClientData__Sources__1: /app/ClientData/game_pak
      World__ExpRate: ${AAEMU_EXP_RATE:-5.0}
      World__GrowthRate: ${AAEMU_GROWTH_RATE:-100.0}
      World__GeoDataMode: ${AAEMU_GEODATA_MODE:-false}
      Labor__Max: ${AAEMU_LABOR_MAX:-20000}
      Labor__MaxPremium: ${AAEMU_LABOR_MAX_PREMIUM:-20000}
      Labor__TickAmount: ${AAEMU_LABOR_ONLINE_AMOUNT:-50}
      Labor__TickAmountPremium: ${AAEMU_LABOR_ONLINE_PREMIUM_AMOUNT:-50}
      Labor__TickMinutes: ${AAEMU_LABOR_TICK_MINUTES:-5}
      LaborOffline__TickAmount: ${AAEMU_LABOR_OFFLINE_AMOUNT:-50}
      LaborOffline__TickAmountPremium: ${AAEMU_LABOR_OFFLINE_PREMIUM_AMOUNT:-50}
      LaborOffline__TickMinutes: ${AAEMU_LABOR_OFFLINE_TICK_MINUTES:-5}
      TZ: ${AAEMU_TIMEZONE:-America/Santiago}
    ports:
      - "${AAEMU_GAME_HOST_PORT:-1239}:1239/tcp"
      - "${AAEMU_STREAM_PORT:-1250}:${AAEMU_STREAM_PORT:-1250}/tcp"
    volumes:
      - type: bind
        source: ${AAEMU_CLIENT_DATA_PATH:?Define AAEMU_CLIENT_DATA_PATH in .env.docker}
        target: /app/ClientData
        read_only: true
      - type: bind
        source: ${AAEMU_COMPACT_PATH:?Define AAEMU_COMPACT_PATH in .env.docker}
        target: /app/Data/compact.sqlite3
        read_only: true
      - aaemu-game-logs:/app/Logs
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1239 && nc -z 127.0.0.1 $${StreamNetwork__Port}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    stop_grace_period: 30s
    depends_on:
      database:
        condition: service_healthy
      login:
        condition: service_healthy
    networks:
      - aaemu-network

  adminer:
    image: adminer:5
    container_name: aaemu-adminer
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: database
    ports:
      - "127.0.0.1:${AAEMU_ADMINER_PORT:-8080}:8080/tcp"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - aaemu-network

networks:
  aaemu-network:
    name: aaemu-network
    driver: bridge

volumes:
  aaemu-mysql-data:
    name: aaemu-mysql-data
  aaemu-login-logs:
    name: aaemu-login-logs
  aaemu-game-logs:
    name: aaemu-game-logs
