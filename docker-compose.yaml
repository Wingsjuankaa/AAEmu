services:
    db:
        # MySql.Data 8.0.13 in this historical branch is incompatible with
        # newer MySQL 8.0 releases (tested against 8.0.46).
        image: mysql:8.0.28
        restart: unless-stopped
        command: --default_authentication_plugin=mysql_native_password
        volumes:
            - db-data:/var/lib/mysql
            - ./SQL:/aaemu-schema:ro
            - ./SQL/docker-init/10-initialize-aaemu.sh:/docker-entrypoint-initdb.d/10-initialize-aaemu.sh:ro
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
        ports:
            - ${MYSQL_PUBLIC_PORT}:3306

    adminer:
        image: adminer
        restart: unless-stopped
        environment:
            ADMINER_DEFAULT_DB_DRIVER: mysql
            ADMINER_DEFAULT_DB_HOST: db
            ADMINER_DESIGN: nette
        ports:
            - ${ADMINER_PUBLIC_PORT}:8080
        depends_on:
            - db

    login:
        build:
            context: .
            dockerfile: ./AAEmu.Login/Dockerfile
            args:
                - CONFIGURATION=${BUILD_CONFIGURATION}
                - FRAMEWORK=${BUILD_FRAMEWORK}
                - RUNTIME=${BUILD_RUNTIME}
                - DB_HOST=db
                - DB_PORT=3306
                - DB_USER=${DB_USER}
                - DB_PASSWORD=${DB_PASSWORD}
                - INTERNAL_PORT=${LOGIN_INTERNAL_PORT}
                - PUBLIC_PORT=${LOGIN_PUBLIC_PORT}
        image: aaemu-login:${PROJECT_VERSION_PREFIX}-${PROJECT_VERSION_SUFFIX}
        restart: unless-stopped
        environment:
            DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
        ports:
            - ${LOGIN_PUBLIC_PORT}:${LOGIN_PUBLIC_PORT}
        depends_on:
            - db

    game:
        build:
            context: .
            dockerfile: ./AAEmu.Game/Dockerfile
            args:
                - CONFIGURATION=${BUILD_CONFIGURATION}
                - FRAMEWORK=${BUILD_FRAMEWORK}
                - RUNTIME=${BUILD_RUNTIME}
                - DB_HOST=db
                - DB_PORT=3306
                - DB_USER=${DB_USER}
                - DB_PASSWORD=${DB_PASSWORD}
                - LOGIN_HOST=login
                - LOGIN_PORT=${LOGIN_INTERNAL_PORT}
                - GAME_PORT=${GAME_PUBLIC_PORT}
                - STREAM_PORT=${STREAM_PUBLIC_PORT}
        image: aaemu-game:${PROJECT_VERSION_PREFIX}-${PROJECT_VERSION_SUFFIX}
        restart: unless-stopped
        volumes:
          - type: bind
            source: ${CLIENT_GAME_PAK}
            target: /app/ClientData/game_pak
            read_only: true
          - type: bind
            source: ${COMPACT_DB}
            target: /app/Data/compact.sqlite3
            read_only: true
        environment:
            DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
            # Controlled AA8 equipment validation window. This permits only
            # phase_a_candidate concrete definitions; catalog_only remains blocked.
            AAEMU_ITEM8_STAGING_ALLOW_CANDIDATES: 1
        ports:
            - ${GAME_PUBLIC_PORT}:${GAME_PUBLIC_PORT}
            - ${STREAM_PUBLIC_PORT}:${STREAM_PUBLIC_PORT}
        depends_on:
            - login

volumes:
    db-data:
